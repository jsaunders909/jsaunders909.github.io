- title: Experience
  type: time_table
  contents:
    - title: Senior Research Scientist
      institution: Tavus, London (Hybrid), UK
      year: Feb 2025 - Present
      description:
        - Contributed to Phoenix-4, Tavus's animation and rendering model for real-time video generation of avatars, using Gaussian Splatting, Flow Matching, and GANs. Developed a novel implicit Gaussian Avatar model improving expressiveness, achieving a 25% increase in lip-sync metrics vs Phoenix-3.
        - Lead a research team investigating video diffusion models as a next-generation alternative to current avatar rendering pipelines, with a focus on pushing towards real-time capability.
        - "Key research directions: identity stability in autoregressive generation, Self-Forcing and related techniques for eliminating exposure bias, model distillation and quantization for real-time deployment."
        - Runs a significant portion of the hiring process — leading technical interviews, supervising intern projects, and mentoring junior researchers.
    - title: Founder & Freelance Consultant
      institution: RealSync AI, Chippenham, UK
      year: Apr 2024 - Present
      description:
        - Founded RealSync to provide consultancy and coding services for Avatar companies.
        - Helped several clients build prototypes now in production with tens to hundreds of thousands of users.
    - title: AI Research Science Intern
      institution: Microsoft, Redmond, WA, USA
      year: Jun 2024 - Sept 2024
      description:
        - Built a system for creating real-time, animatable, photorealistic Avatars from a single image or short video using Gaussian Splatting and synthetic data.
        - Led a research project with 10+ members (research scientists, engineers, designers, PMs); built a working prototype.
        - Work led to a CVPR 2025 paper (GASP) and a filed patent.
        - Also assisted on an LLM + scene graph spatial reasoning project, leading to a filed patent and a paper under review.
    - title: AI Scientist
      institution: DeepReel, London (Remote)
      year: Jun 2022 - Apr 2024
      description:
        - Early-stage employee at an AI-driven digital human company producing photorealistic custom avatars.
        - Proposed the pipeline for the prototype product using cutting-edge research methodology.
        - Proposed and won grant funding for a project improving the company's models.
        - Implemented 3D reconstruction, neural rendering, transformer, and CNN-based models in PyTorch.
    - title: Research Intern
